name: Update Schedule

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/manual_schedule.json'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r scraper/requirements.txt
      - name: Run scraper
        run: python scraper/main.py
      - name: Commit and push
        run: |
          git config user.name "Schedule Bot"
          git config user.email "bot@schedule.local"
          git add data/schedule.json
          git commit -m "📅 Обновление расписания" || echo "No changes"
          git push
